        - 04-pudal-dasar.qmd
        - 05-graf-model-masalah.qmd
        - 06-tiga-engine.qmd
        - 07-energi-kerja-sumberdaya.qmd
        - 08-lima-pudal.qmd
        - 09-milestone-replanning.qmd
        - 10-learning-exploration.qmd
        - 11-model-formal.qmd
    - part: "BAGIAN III — IMPLEMENTASI ACADEMIC COMMONS"
      chapters:
        - 12-arsitektur-agen.qmd
        - 13-enam-learning-paths.qmd
        - 14-proyek-uas.qmd
        - 15-implementasi-teknis.qmd
        - 16-evaluasi-dan-agenda-riset.qmd
    - part: "BAGIAN IV — ENAM TEMA KOMPETENSI AKADEMIK TISE"
      chapters:
        - tise-six-themes/00-pengantar-enam-tema.qmd
        - tise-six-themes/01-kerangka-tise.qmd
        - tise-six-themes/02-tema1-learning.qmd
        - tise-six-themes/03-tema2-literature.qmd
        - tise-six-themes/04-tema3-writing.qmd
        - tise-six-themes/05-tema4-data.qmd
        - tise-six-themes/06-tema5-visualisasi.qmd
        - tise-six-themes/07-tema6-problem-solving.qmd
        - tise-six-themes/08-implementasi-asesmen.qmd
        - tise-six-themes/09-template-kerja.qmd
