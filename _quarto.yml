    - 17-penutup.qmd
  appendices:
    - A-register-42-artefak.qmd
    - B-template-kasus.qmd
    - C-glosarium.qmd
    - D-sumber-dan-gambar.qmd
    - E-penggunaan.qmd
    - tise-six-themes/appendix-tools.qmd

lang: id
execute:
  echo: false
  freeze: auto
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: tise-six-themes/styles/book.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    smooth-scroll: true
    fig-responsive: true
  

bibliography: tise-six-themes/references.bib

crossref:
  fig-title: "Gambar"
  tbl-title: "Tabel"
